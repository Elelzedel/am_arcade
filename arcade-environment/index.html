<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AM Arcade</title>
    <style>
      :root {
        --pink: #ff2bd6;
        --cyan: #00e5ff;
        --yellow: #ffe066;
        --font: "Press Start 2P", monospace;
      }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #000; }
      body { font-family: var(--font); color: #fff; user-select: none; }
      canvas.world { display: block; position: fixed; inset: 0; }

      .overlay {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        transition: opacity 0.4s ease; z-index: 20;
      }
      .overlay.hidden { opacity: 0; pointer-events: none; }

      #intro { background: radial-gradient(ellipse at center, rgba(10, 4, 30, 0.35) 0%, rgba(0, 0, 0, 0.85) 75%); cursor: pointer; }
      #intro .emblem {
        width: clamp(110px, 16vh, 220px); height: auto; margin-bottom: 6px;
        filter: drop-shadow(0 0 24px #ff2bd655) drop-shadow(0 0 40px #00e5ff33);
        animation: hover 5s ease-in-out infinite;
      }
      #intro h1 {
        font-size: clamp(32px, 7vw, 96px); margin: 0 0 18px; color: var(--pink); letter-spacing: 4px;
        text-shadow: 0 0 8px var(--pink), 0 0 30px var(--pink), 0 0 60px #ff2bd688, 4px 4px 0 #2a0022;
        animation: flicker 6s infinite;
      }
      #intro .tagline { color: var(--cyan); font-size: clamp(10px, 1.3vw, 16px); text-shadow: 0 0 10px var(--cyan); margin-bottom: 48px; }
      .enter {
        font-size: clamp(14px, 1.8vw, 22px); padding: 18px 30px; border: 3px solid #fff; border-radius: 8px;
        box-shadow: 0 0 20px #ffffff66, inset 0 0 20px #ffffff22; animation: pulse 1.4s ease-in-out infinite;
      }
      .enter.loading { animation: none; opacity: 0.5; border-style: dashed; }
      .controls {
        display: grid; grid-template-columns: auto auto; gap: 12px 28px; margin-top: 44px;
        font-size: clamp(9px, 0.9vw, 12px); text-align: left; color: #c9c3ff;
      }
      .controls kbd {
        font-family: var(--font); color: var(--yellow); background: #ffffff10; border: 1px solid #ffffff30;
        border-radius: 4px; padding: 4px 6px; margin-right: 4px;
      }
      .controls div:nth-child(odd) { text-align: right; }
      .credits { position: absolute; bottom: 22px; font-size: 9px; color: #6f6a90; letter-spacing: 1px; }
      .warning { margin-top: 26px; color: var(--yellow); font-size: 10px; max-width: 520px; line-height: 1.8; }

      #pause { background: rgba(4, 2, 12, 0.72); cursor: pointer; }
      #pause h2 { font-size: clamp(28px, 4vw, 56px); margin: 0 0 30px; color: var(--cyan); text-shadow: 0 0 20px var(--cyan); }
      #pause .hint { font-size: clamp(10px, 1.1vw, 14px); line-height: 2.4; }
      #pause .hint b { color: var(--yellow); font-weight: normal; }

      #crosshair {
        position: fixed; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px 0 0 -3px;
        border-radius: 50%; background: #ffffffcc; box-shadow: 0 0 6px #fff; z-index: 10; transition: opacity 0.2s, transform 0.2s;
      }
      #crosshair.target { transform: scale(1.8); background: var(--yellow); box-shadow: 0 0 10px var(--yellow); }

      #prompt {
        position: fixed; left: 50%; bottom: 12%; transform: translateX(-50%) translateY(10px);
        padding: 16px 22px; background: rgba(6, 4, 18, 0.82); border: 2px solid var(--accent, #fff);
        border-radius: 10px; box-shadow: 0 0 24px var(--accent, #fff); z-index: 10; opacity: 0;
        transition: opacity 0.18s, transform 0.18s; text-align: center; white-space: nowrap;
      }
      #prompt.show { opacity: 1; transform: translateX(-50%) translateY(0); }
      #prompt .action { font-size: clamp(12px, 1.3vw, 18px); }
      #prompt .action kbd {
        font-family: var(--font); display: inline-block; padding: 6px 9px; margin-right: 10px; border-radius: 5px;
        background: #fff; color: #000; box-shadow: 0 3px 0 #888;
      }
      #prompt .title { color: var(--accent, #fff); text-shadow: 0 0 10px var(--accent, #fff); }
      #prompt .sub { margin-top: 12px; font-size: clamp(8px, 0.8vw, 11px); color: var(--yellow); }

      #toast {
        position: fixed; top: 22%; left: 50%; transform: translateX(-50%); font-size: 12px; color: var(--yellow);
        background: rgba(0,0,0,0.7); padding: 12px 16px; border-radius: 6px; z-index: 10; opacity: 0; transition: opacity 0.3s;
      }
      #toast.show { opacity: 1; }
      #inputDebug {
        position: fixed; top: 10px; left: 10px; z-index: 40; margin: 0; padding: 8px 10px;
        font: 12px/1.6 monospace; color: #9f9; background: rgba(0, 0, 0, 0.72); white-space: pre; pointer-events: none;
      }
      #fade { position: fixed; inset: 0; background: #000; pointer-events: none; z-index: 30; transition: opacity 1.2s ease; }
      .hidden { opacity: 0 !important; pointer-events: none; }

      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.45; } }
      @keyframes hover { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
      @keyframes flicker {
        0%, 18%, 22%, 25%, 53%, 57%, 100% { opacity: 1; }
        20%, 24%, 55% { opacity: 0.55; }
      }
    </style>
  </head>
  <body>
    <div id="fade"></div>

    <div id="intro" class="overlay">
      <img id="introEmblem" class="emblem hidden" alt="">
      <h1>AM ARCADE</h1>
      <div class="tagline">WALK THE FLOOR &middot; PLAY THE MACHINES</div>
      <div class="enter loading" id="enterButton">LOADING...</div>
      <div class="controls">
        <div><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd></div><div>WALK</div>
        <div><kbd>MOUSE</kbd></div><div>LOOK AROUND</div>
        <div><kbd>SHIFT</kbd></div><div>RUN</div>
        <div><kbd>E</kbd></div><div>PLAY A MACHINE</div>
        <div><kbd>Q</kbd></div><div>STEP AWAY</div>
        <div><kbd>ESC</kbd></div><div>PAUSE</div>
        <div><kbd>[</kbd><kbd>]</kbd></div><div>MOUSE SPEED</div>
      </div>
      <div class="warning hidden" id="touchWarning">AM ARCADE NEEDS A KEYBOARD AND MOUSE.<br>PLAY ON A DESKTOP BROWSER FOR THE FULL EXPERIENCE.</div>
      <div class="credits">A GAME BY AJCLAUSEN &amp; ELELZEDEL</div>
    </div>

    <div id="pause" class="overlay hidden">
      <h2>PAUSED</h2>
      <div class="hint" id="pauseHint"></div>
    </div>

    <div id="crosshair" class="hidden"></div>
    <div id="prompt"><div class="action"></div><div class="sub"></div></div>
    <div id="toast"></div>
    <pre id="inputDebug" class="hidden"></pre>
  </body>
</html>
